<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="study.js"></script>
</head>
<body>
  <div id="clockdisp"></div>
</body>
<script>
  let clockdisp = document.getElementById('clockdisp');
  let x = new Timer('s')

  setInterval(() => {
    clockdisp.innerHTML = x.getTime();
  }, 100);
</script>
</html>
