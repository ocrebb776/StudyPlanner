<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code to Image Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 16px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Code to Image Converter</h1>
    <textarea id="codeInput" placeholder="Paste your code here..."></textarea>
    <button onclick="generateImage()">Generate Image</button>
    <canvas id="canvas"></canvas>

    <script>
        function generateImage() {
            const code = document.getElementById('codeInput').value;
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            // Set canvas size
            const lines = code.split('\n');
            const width = 800;
            const lineHeight = 24;
            const padding = 10;
            const height = lines.length * lineHeight + padding * 2;
            canvas.width = width;
            canvas.height = height;

            // Set background and text style
            context.fillStyle = '#ffffff'; // White background
            context.fillRect(0, 0, width, height);
            context.font = '16px monospace';
            context.fillStyle = '#000000'; // Black text

            // Render the code line by line
            lines.forEach((line, index) => {
                context.fillText(line, padding, padding + (index + 1) * lineHeight);
            });

            // Create the image
            const imageURL = canvas.toDataURL('image/png');

            // Create a download link
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = 'code_image.png';
            downloadLink.click();
        }
    </script>

</body>
</html>
